# Render Blueprint — deploy backend + Postgres + frontend ทั้งหมดในครั้งเดียว
# วิธีใช้: สมัคร render.com (ฟรี, login ด้วย GitHub ได้) → New → Blueprint →
# เลือก repo นี้ → Render จะอ่านไฟล์นี้และสร้างทั้ง 3 service ให้อัตโนมัติ

databases:
  - name: sme-inventory-db
    plan: free
    databaseName: sme_inventory
    user: sme_inventory_user

services:
  - type: web
    name: sme-inventory-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    # ต้องใช้ `python -m alembic` ไม่ใช่ `alembic` เฉย ๆ — bare console-script ไม่เติม
    # CWD เข้า sys.path ให้อัตโนมัติ ทำให้ `import app.models` ใน env.py หา `app` ไม่เจอ
    # (ตรวจสอบซ้ำจริงแล้วว่า uvicorn ไม่มีปัญหานี้ ปล่อยเป็น bare command ได้ตามเดิม)
    # ⚠️ ชั่วคราว — `python -m scripts.seed --reset-if-stale` ถูกแทรกไว้เพื่ออัปเดตข้อมูลสาธิต
    # ให้เป็นชุดใหม่ (CR-013) โดยไม่ต้องส่ง DATABASE_URL ออกนอก Render · Render ฉีดตัวแปรนี้
    # ให้ service อยู่แล้ว seed จึงรันได้จากในนี้เลย
    #
    # ปลอดภัยที่จะถูกเรียกซ้ำ: `--reset-if-stale` จะเขียนทับเฉพาะตอนเจอข้อมูลชุดเก่า
    # (ดูจากจำนวนวันที่มีการขาย) ถ้าเป็นชุดใหม่แล้วจะไม่ทำอะไรและจบทันที — จำเป็นมาก
    # เพราะ free tier หลับแล้วตื่นบ่อย startCommand จึงถูกรันซ้ำทุกครั้งที่มีคนเปิดเว็บ
    #
    # จะถอดบรรทัดนี้ออกทันทีที่ยืนยันว่าข้อมูลบน production เป็นชุดใหม่แล้ว
    startCommand: "python -m alembic upgrade head && python -m scripts.seed --reset-if-stale && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9 # Render เดิมใช้ 3.14 เป็น default — pydantic-core ยังไม่มี
        # prebuilt wheel สำหรับ 3.14 ทำให้ pip ต้อง compile จาก source ด้วย Rust/maturin
        # ซึ่ง fail เพราะ cargo registry cache เขียนไม่ได้บน Render (read-only filesystem)
        # ใช้ 3.11 ให้ตรงกับที่ทดสอบจริงทั้งหมด (local + GitHub Actions CI)
      - key: DATABASE_URL
        fromDatabase:
          name: sme-inventory-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render สุ่มค่าให้เอง ไม่ต้องใส่เอง — ไม่มี secret hardcode
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: DATA_RETENTION_YEARS
        value: "3"
      # FR-012 / CR-006 — sync:false = Render จะไม่เติมค่าอะไรให้ ทีมต้องกรอกเองผ่าน
      # dashboard (Environment tab) หลัง deploy — AI ไม่เคยเห็น/ตั้งค่าตัวจริงเหล่านี้เลย
      - key: ALERT_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: sme-inventory-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      # ต้องแก้เป็น URL จริงของ sme-inventory-api หลัง deploy backend สำเร็จครั้งแรก
      # (Render กำหนด URL ให้หลัง service สร้างเสร็จ ไม่รู้ล่วงหน้า)
      - key: VITE_API_URL
        value: https://sme-inventory-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html # React Router client-side routing ต้องมีอันนี้
